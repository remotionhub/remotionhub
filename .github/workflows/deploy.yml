name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: full
        type: choice
        options:
          - full
          - backend
          - frontend
          - smoke
      dry_run:
        description: Validate without deploying
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release_source_guard:
    name: Release / Source guard
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deploys must run from refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

  preflight:
    name: Release / Preflight
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - release_source_guard
    env:
      TARGET: ${{ inputs.target }}
      DRY_RUN: ${{ inputs.dry_run }}
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "$name is required for target=$TARGET dry_run=$DRY_RUN" >&2
              exit 1
            fi
          }

          require_env VITE_CONVEX_URL

          if [ "$TARGET" = "backend" ] || [ "$TARGET" = "full" ]; then
            require_env CONVEX_DEPLOY_KEY
          fi

          if [ "$TARGET" = "frontend" ] || [ "$TARGET" = "full" ]; then
            require_env CLOUDFLARE_API_TOKEN
            require_env CLOUDFLARE_ACCOUNT_ID
          fi

          if [ "$TARGET" = "smoke" ] || { [ "$TARGET" = "full" ] && [ "$DRY_RUN" = "false" ]; }; then
            require_env PRODUCTION_URL
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run ci:unit
      - run: npm run ci:types-build

  backend_deploy:
    name: Release / Convex backend
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && (inputs.target == 'backend' || inputs.target == 'full') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dry-run Convex deploy
        if: ${{ inputs.dry_run }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --dry-run --typecheck enable
      - name: Deploy Convex backend
        if: ${{ !inputs.dry_run }}
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --typecheck enable --message "GitHub Actions deploy ${GITHUB_SHA}"

  frontend_deploy:
    name: Release / Cloudflare frontend
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - backend_deploy
    if: ${{ always() && needs.preflight.result == 'success' && (needs.backend_deploy.result == 'success' || needs.backend_deploy.result == 'skipped') && (inputs.target == 'frontend' || inputs.target == 'full') }}
    env:
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Cloudflare frontend
        run: npm run build
      - name: Dry-run Cloudflare deploy
        if: ${{ inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --dry-run
      - name: Deploy Cloudflare frontend
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  production_smoke:
    name: Release / Production smoke
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - preflight
      - backend_deploy
      - frontend_deploy
    if: ${{ always() && needs.preflight.result == 'success' && (needs.backend_deploy.result == 'success' || needs.backend_deploy.result == 'skipped') && (needs.frontend_deploy.result == 'success' || needs.frontend_deploy.result == 'skipped') && (inputs.target == 'smoke' || (inputs.target == 'full' && !inputs.dry_run)) }}
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Probe production URL
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --max-time 20 "$PRODUCTION_URL" >/tmp/production-smoke.html
          test -s /tmp/production-smoke.html

  release_summary:
    name: Release / Summary
    runs-on: ubuntu-latest
    needs:
      - preflight
      - backend_deploy
      - frontend_deploy
      - production_smoke
    if: ${{ always() }}
    steps:
      - name: Write release summary
        run: |
          {
            echo "## Deploy workflow summary"
            echo
            echo "- Target: ${{ inputs.target }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Preflight: ${{ needs.preflight.result }}"
            echo "- Backend: ${{ needs.backend_deploy.result }}"
            echo "- Frontend: ${{ needs.frontend_deploy.result }}"
            echo "- Production smoke: ${{ needs.production_smoke.result }}"
            echo
            echo "Production smoke is intentionally lightweight until a dedicated Playwright production smoke suite exists."
          } >>"$GITHUB_STEP_SUMMARY"
